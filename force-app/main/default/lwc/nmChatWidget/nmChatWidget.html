<template>
    <section class="nm-widget" aria-label={i18n.widgetAriaLabel}>

        <header class="nm-header">
            <span class="nm-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" class="nm-mark-svg" focusable="false">
                    <circle cx="16" cy="16" r="15" class="nm-mark-ring"/>
                    <path d="M16 6 L23 22 L16 18 L9 22 Z" class="nm-mark-arrow"/>
                </svg>
            </span>
            <span class="nm-headtext">
                <h2 class="nm-title">{i18n.title}</h2>
                <span class="nm-subtitle">{i18n.subtitle}</span>
            </span>
            <button
                type="button"
                class="nm-restart"
                aria-label={i18n.restartAria}
                onclick={handleRestart}
                disabled={isLoading}
            >
                <svg viewBox="0 0 24 24" class="nm-restart-icon" aria-hidden="true" focusable="false">
                    <path d="M20 12a8 8 0 1 1-2.3-5.6"/>
                    <path d="M20 4v5h-5"/>
                </svg>
                <span class="nm-restart-text">{i18n.restartLabel}</span>
            </button>
        </header>

        <!-- Journey stepper: shows how far along the conversation is. -->
        <ol class="nm-steps" aria-label={i18n.stepsAria}>
            <template for:each={steps} for:item="st">
                <li key={st.key} class={st.cssClass} aria-current={st.current}>
                    <span class="nm-step-dot" aria-hidden="true">
                        <template lwc:if={st.done}>
                            <svg viewBox="0 0 16 16" focusable="false" class="nm-step-check">
                                <path d="M3 8.5 L6.5 12 L13 4.5"/>
                            </svg>
                        </template>
                    </span>
                    <span class="nm-step-label">{st.label}</span>
                    <span class="nm-sr-only">{st.statusText}</span>
                </li>
            </template>
        </ol>

        <div
            class="nm-messages"
            role="log"
            aria-live="polite"
            aria-label={i18n.scrollRegionLabel}
            tabindex="0"
            lwc:ref="messageList"
        >
            <template for:each={messages} for:item="msg">
                <div key={msg.id} class={msg.rowClass}>
                    <span class="nm-sender">{msg.senderLabel}</span>
                    <div class="nm-bubble">
                        <template for:each={msg.blocks} for:item="b">
                            <div key={b.key} class="nm-block">

                                <!-- Occupation card -->
                                <template lwc:if={b.isCard}>
                                    <article class="nm-card">
                                        <span class="nm-card-icon" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" focusable="false">
                                                <path d={b.iconPath}/>
                                            </svg>
                                        </span>
                                        <h3 class="nm-card-title">{b.title}</h3>
                                        <p class="nm-card-body">{b.body}</p>
                                        <template lwc:if={b.hasBadge}>
                                            <p class="nm-badge">
                                                <span class="nm-badge-dot" aria-hidden="true"></span>{b.badge}
                                            </p>
                                        </template>
                                    </article>
                                </template>

                                <!-- Mentor / person card -->
                                <template lwc:elseif={b.isPerson}>
                                    <article class="nm-person">
                                        <span class="nm-avatar" aria-hidden="true">{b.initials}</span>
                                        <p class="nm-person-body">{b.text}</p>
                                    </article>
                                </template>

                                <!-- Bulleted list -->
                                <template lwc:elseif={b.isList}>
                                    <ul class="nm-list">
                                        <template for:each={b.items} for:item="li">
                                            <li key={li.key} class="nm-li">
                                                <template for:each={li.segments} for:item="sg">
                                                    <template lwc:if={sg.bold}>
                                                        <strong key={sg.key}>{sg.text}</strong>
                                                    </template>
                                                    <template lwc:else>
                                                        <span key={sg.key}>{sg.text}</span>
                                                    </template>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>

                                <!-- Paragraph with inline bold -->
                                <template lwc:else>
                                    <p class="nm-text">
                                        <template for:each={b.segments} for:item="sg">
                                            <template lwc:if={sg.bold}>
                                                <strong key={sg.key}>{sg.text}</strong>
                                            </template>
                                            <template lwc:else>
                                                <span key={sg.key}>{sg.text}</span>
                                            </template>
                                        </template>
                                    </p>
                                </template>

                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template lwc:if={isLoading}>
                <div class="nm-row nm-row--agent">
                    <span class="nm-sender">{i18n.agentLabel}</span>
                    <div class="nm-bubble nm-bubble--typing" role="status" aria-label={i18n.typingAria}>
                        <span class="nm-dot" aria-hidden="true"></span>
                        <span class="nm-dot" aria-hidden="true"></span>
                        <span class="nm-dot" aria-hidden="true"></span>
                        <span class="nm-sr-only">{i18n.typingAria}</span>
                    </div>
                </div>
            </template>
        </div>

        <!-- Screen-reader announcer. Always present so it is a live region
             before content arrives, and holds only the newest reply so the
             whole transcript is not re-read on every turn. -->
        <div class="nm-sr-only" aria-live="polite" aria-atomic="true">{announcement}</div>

        <template lwc:if={errorMessage}>
            <div class="nm-error" role="alert">
                <span class="nm-error-mark" aria-hidden="true">!</span>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:if={showChips}>
            <div class="nm-starters">
                <p class="nm-starters-label" id="nm-starters-label">{chipsLabel}</p>
                <div class="nm-chips" role="group" aria-labelledby="nm-starters-label">
                    <template for:each={chips} for:item="s">
                        <button
                            key={s.key}
                            type="button"
                            class="nm-chip"
                            data-text={s.text}
                            aria-label={s.aria}
                            onclick={handleStarter}
                        >{s.text}</button>
                    </template>
                </div>
            </div>
        </template>

        <template lwc:if={showResumeDownload}>
            <div class="nm-resume-dl">
                <button
                    type="button"
                    class="nm-resume-dl-btn"
                    onclick={handleDownloadResume}
                >
                    <span class="nm-dl-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
                        </svg>
                    </span>
                    {i18n.downloadLabel}
                </button>
            </div>
        </template>

        <div class="nm-composer">
            <!-- Attach control. A real <input type="file"> stays in the DOM and
                 keeps its own keyboard and assistive-tech behaviour; the label
                 is the visible, focusable control. A <button> that clicks a
                 hidden input is the usual pattern and it strands keyboard users. -->
            <input
                id="nm-file"
                type="file"
                class="nm-file"
                accept=".pdf,.txt,.md,text/plain,application/pdf"
                onchange={handleFile}
                disabled={isLoading}
                lwc:ref="file"
            />
            <label class="nm-attach" for="nm-file" title={i18n.attachAria}>
                <span class="nm-attach-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M16.5 6.5v8a4.5 4.5 0 1 1-9 0V6a3 3 0 0 1 6 0v8a1.5 1.5 0 1 1-3 0V7"/>
                    </svg>
                </span>
                <span class="nm-sr-only">{i18n.attachAria}</span>
            </label>
            <label for="nm-input" class="nm-sr-only">{i18n.inputAriaLabel}</label>
            <input
                id="nm-input"
                type="text"
                class="nm-input"
                placeholder={i18n.inputPlaceholder}
                maxlength="500"
                autocomplete="off"
                enterkeyhint="send"
                value={inputText}
                onkeydown={handleKeydown}
                oninput={handleInput}
                disabled={isLoading}
                lwc:ref="input"
            />
            <button
                type="button"
                class="nm-send-btn"
                aria-label={i18n.sendAriaLabel}
                onclick={handleSend}
                disabled={isSendDisabled}
            >{i18n.sendLabel}</button>
        </div>
    </section>
</template>
