<template>
    <section class="nm-hero">
        <div class="nm-hero-inner">
            <!-- The lockup. aria-hidden with a visually hidden name beside it:
                 the wordmark is already real text, so reading the graphic too
                 would say "Next Mission" twice. -->
            <p class="nm-lockup">
                <span class="nm-lockup-mark" aria-hidden="true">
                    <svg viewBox="0 0 64 64" focusable="false">
                        <rect width="64" height="64" rx="16" class="nm-lk-plate"/>
                        <path class="nm-lk-chev-2" d="M16 56 L32 43 L48 56"/>
                        <path class="nm-lk-chev-1" d="M16 44 L32 31 L48 44"/>
                        <path class="nm-lk-arrow"
                              d="M32 5 L45 20 L38.5 20 L38.5 25.5 L25.5 25.5 L25.5 20 L19 20 Z"/>
                    </svg>
                </span>
                <span class="nm-lockup-text">
                    <span class="nm-lockup-name">Next Mission</span>
                    <span class="nm-lockup-tag">Translating service into careers</span>
                </span>
            </p>

            <p class="nm-eyebrow">
                <span class="nm-eyebrow-dot" aria-hidden="true"></span>
                For veterans and military spouses
            </p>
            <h1 class="nm-h1">Your service already qualifies you.<br/>Let&rsquo;s prove it.</h1>
            <p class="nm-lede">
                Tell Next Mission your specialty code, describe what you did, or upload your resume.
                It maps your experience to real civilian occupations using federal labor data, tells
                you what those jobs actually pay, and connects you with someone who made the same move.
            </p>

            <ul class="nm-stats">
                <template for:each={stats} for:item="s">
                    <li key={s.key} class="nm-stat">
                        <span class="nm-stat-num">{s.num}</span>
                        <span class="nm-stat-lbl">{s.label}</span>
                    </li>
                </template>
            </ul>
        </div>

        <!-- The graphic. The animated stage is aria-hidden and duplicated as
             ordered text below it, so assistive tech gets ALL THREE mappings
             rather than whichever scene happened to be on screen. Both are
             rendered from the same array in the component, so they cannot drift
             apart. -->
        <figure class={artClass}>
            <p class="nm-art-eyebrow">
                <span class="nm-eyebrow-dot" aria-hidden="true"></span>
                Specialty code <span aria-hidden="true">&#8594;</span><span class="nm-sr-only">to</span> civilian occupations
            </p>

            <div class="nm-stage" aria-hidden="true">
                <template for:each={scenes} for:item="sc">
                    <div key={sc.key} class={sc.cls}>
                        <div class="nm-source">
                            <div class="nm-chip">
                                <span class="nm-branch">{sc.branch}</span>
                                <span class="nm-code">{sc.code}</span>
                                <span class="nm-mos">{sc.mos}</span>
                            </div>
                        </div>

                        <div class="nm-wires">
                            <svg viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                                <g fill="none" stroke="#4F7A63" stroke-width="2"
                                   vector-effect="non-scaling-stroke" stroke-linecap="round">
                                    <path class="nm-wire nm-wire-1" pathLength="100" d="M0 50 C46 50 54 16.7 100 16.7"></path>
                                    <path class="nm-wire nm-wire-2" pathLength="100" d="M0 50 L100 50"></path>
                                    <path class="nm-wire nm-wire-3" pathLength="100" d="M0 50 C46 50 54 83.3 100 83.3"></path>
                                </g>
                            </svg>
                        </div>

                        <ul class="nm-nodes">
                            <template for:each={sc.roles} for:item="r">
                                <li key={r.key} class="nm-node">
                                    <span class="nm-dot"></span>
                                    <p class="nm-role">{r.title}</p>
                                    <p class="nm-pay">
                                        <span class="nm-wage">{r.wage}</span>
                                        <span class="nm-note">median / yr</span>
                                    </p>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>

            <div class="nm-art-footer">
                <figcaption class="nm-caption">
                    Median annual wage. Source: U.S. Bureau of Labor Statistics,
                    Occupational Employment and Wage Statistics, May&nbsp;2025.
                </figcaption>

                <button type="button" class="nm-toggle" aria-pressed={isPlaying} onclick={handleToggle}>
                    <svg class="nm-ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <g class="nm-ico-pause">
                            <rect x="4" y="3" width="3" height="10" rx="1"></rect>
                            <rect x="9" y="3" width="3" height="10" rx="1"></rect>
                        </g>
                        <path class="nm-ico-play" d="M5 3.4 13 8l-8 4.6z"></path>
                    </svg>
                    <span>{toggleLabel}</span>
                </button>
            </div>

            <!-- Same data, for assistive technology. Rendered from the same
                 array as the scenes above; there is no second copy to forget. -->
            <div class="nm-sr-only">
                <h2>Example military to civilian occupation matches</h2>
                <p>
                    Each military specialty code is followed by civilian occupations it maps to
                    and the median annual wage for each. Source: {source}.
                </p>
                <template for:each={scenes} for:item="sc">
                    <div key={sc.key}>
                        <h3>{sc.heading}</h3>
                        <ul>
                            <template for:each={sc.roles} for:item="r">
                                <li key={r.key}>{r.sr}</li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </figure>
    </section>
</template>
